<!-- Main admin form landmark -->
<form role="form" aria-labelledby="autoSaveHeading" class="admin-form">

    <!-- Auto-save settings -->
    <section aria-labelledby="autoSaveHeading">
        <h3 id="autoSaveHeading">Automatisches Speichern</h3>

        <fieldset>
            <legend>Speicheroptionen</legend>

            <!-- Manual save (recommended) -->
            <div class="radio-option">
                <input type="radio" id="manualSave" name="saveOption" value="manual" checked>
                <label for="manualSave">Manuelles Speichern (empfohlen)</label>
            </div>

            <!-- Time-based auto-save -->
            <div class="radio-option">
                <input type="radio" id="timedSave" name="saveOption" value="timed">
                <label for="timedSave">Zeitbasiertes automatisches Speichern</label>
                <input type="number" id="timedSaveMinutes" name="timedSaveMinutes" min="1" max="60"
                    placeholder="z.B. 5 Minuten" aria-label="Auto-Save Intervall in Minuten">
            </div>

            <!-- Auto-save on exit -->
            <div class="radio-option">
                <input type="radio" id="onExitSave" name="saveOption" value="onExit">
                <label for="onExitSave">Beim Verlassen des Formulars automatisch speichern</label>
            </div>

            <!-- General auto-save toggle -->
            <div class="toggle-container">
                <label class="switch" for="autoSaveToggle">
                    <input type="checkbox" id="autoSaveToggle" aria-checked="false">
                    <span class="slider round"></span>
                    <span class="toggle-label">Auto-Save aktivieren</span>
                </label>
            </div>

        </fieldset>
    </section>

    <!-- Confirmation dialogs settings -->
    <section aria-labelledby="confirmationHeading">
        <h3 id="confirmationHeading">Bestätigungs-Abfragen</h3>

        <div class="toggle-container">
            <label class="switch" for="skipMinorConfirmations">
                <input type="checkbox" id="skipMinorConfirmations" aria-checked="false">
                <span class="slider round"></span>
                <span class="toggle-label">Bestätigungen deaktivieren (für erfahrene Nutzer)</span>
            </label>
        </div>

    </section>

    <!-- Optional: submit button as fallback -->
    <div class="form-actions">
        <button type="submit">Speichern</button>
    </div>

</form>
