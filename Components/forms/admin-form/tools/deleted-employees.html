<!-- Components/forms/admin-form/tools/deleted-employees.html -->
<div class="tool-page deleted-employees-tool">
  <header class="deleted-header">
    <h2> <span class="noto">♻️</span> gelöschte Mitarbeiter wiederherstellen <span class="noto">🗑️</span></h2>
    <div class="controls">
      <button id="refresh-deleted" title="Refresh list">↻ Tabelle auffrischen</button>
      <button id="select-all-toggle" title="Select all">Alle auswählen</button>
      <button id="restore-selected" class="primary" title="Restore selected">
        <span class="noto">🔄 </span> Auswahl wiederherstellen
      </button>
    </div>
  </header>

  <div id="deleted-list-wrap" class="deleted-list-wrap" aria-live="polite">
    <ul id="deleted-list" class="deleted-list" role="list"></ul>
  </div>

  <footer class="deleted-footer">
    <small>Click emoji or "Restore" to reassign an emoji and update end date (10
      years in future).</small>
  </footer>
</div>
