<div id="emoji-customizer">
  <div class="header">
    <h2>Emoji Anpassung</h2>
    <button id="saveCustomEmojies" class="help-icon noto" title="speichern">
      💾
    </button>
  </div>

  <div class="emoji-columns">
    <!-- Employees -->
    <section class="emoji-block">
      <header>
        <h3>Mitarbeiter</h3>
      </header>
      <div id="employee-grid" class="emoji-grid"></div>
    </section>
    <div class="swap-icon-wrapper">
      <div class="noto swap-icon"> ⇄ </div>
    </div>
    <!-- Pool -->
    <section class="emoji-block center-block">
      <header>
        <h3>Vorrat</h3>
        <div class="flex-row">
          <div class="noto big">❓</div>
          <div>
            <i> <span class="noto">🖱️</span> Linksklick: Vorrat → Mitarbeiter</i><br />
            <i> Rechtsklick: Vorrat ← Aufgaben <span class="noto">🖱️</span></i>
          </div>
        </div>
        <button id="add-emoji-btn" title="Neues Unicode Emoji hinzufügen" class="noto">
          ➕
        </button>
      </header>
      <div id="pool-grid" class="emoji-grid"></div>
    </section>
    <div class="swap-icon-wrapper">
      <div class="noto swap-icon"> ⇄ </div>
    </div>
    <!-- Roles -->
    <section class="emoji-block">
      <header>
        <h3>Aufgaben</h3>
      </header>
      <div id="role-grid" class="emoji-grid"></div>
    </section>
  </div>
</div>
