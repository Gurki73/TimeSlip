<section id="calendar-form-container" role="form" aria-labelledby="calendar-form-title">
  <h1 id="calendar-form-title" class="visually-hidden">
    Kalender-Konfiguration
  </h1>
  <div class="calendar-flex-row" id="calendar-collapsibles">
  </div>
</section>


<!-- ===========================
     TEMPLATES
     =========================== -->
<template id="tpl-rule-collapsible">
  <div class="rule-collapsible">
    <legend class="rule-collapsible-legend">
      <button class="rule-collapsible-toggle" aria-expanded="true" type="button">
        <span class="chev-button resize-button" aria-hidden="true" aria-expanded="true"></span>
        <span class="title"> ???</span>
      </button>
      <div class="rule-save-slot"></div>
    </legend>
    <div class="rule-collapsible-content"></div>
  </div>
</template>

<template id="tpl-list">
  <div class="list-calendar-settings">
    <div class="list-controls">
    </div>
    <div class="calendar-setting-scrollcontainer">
      <div class="list-body" role="list"></div>
    </div>
  </div>
</template>

<template id="tpl-list-item">
  <div class="data-row" role="listitem" data-key="">
    <label class="row-left">
      <input type="checkbox" class="row-checkbox" />
      <span class="label-text"></span>
    </label>
    <div class="row-middle">
      <span class="meta-line"></span>
    </div>
    <div class="row-right">
      <span class="status-icon lock-icon" aria-hidden="true"></span>
      <span class="extra-icon" aria-hidden="true"></span>
    </div>
  </div>
</template>

<template id="date-range-template">
  <div class="date-grid date-range">

    <!-- von -->
    <span class="date-label">von:</span>
    <button class="date-trigger noto start-btn" title="Startdatum wählen">📅</button>
    <span class="date-preview start-preview">--.--.----</span>

    <!-- bis -->
    <span class="date-label">bis:</span>
    <button class="date-trigger noto end-btn" title="Enddatum wählen">📅</button>
    <span class="date-preview end-preview">--.--.----</span>

    <!-- dauer -->
    <span class="date-label">Dauer:</span>
    <span class="duration-value">??</span>
    <span class="duration-unit">Tage</span>

    <!-- hidden inputs (can live anywhere inside grid) -->
    <input type="date" class="visually-hidden-date-picker start-input" />
    <input type="date" class="visually-hidden-date-picker end-input" />

  </div>
</template>
