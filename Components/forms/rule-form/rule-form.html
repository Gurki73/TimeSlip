<div id="rule-form-container">
  <!-- ================= Rules & Warnings Scrollbox ================= -->
  <div id="exsiting-ruleh-header" class="center strong">Alle bestehenden Regeln</div>
  <section id="rules-scrollbox" aria-labelledby="rules-scrollbox-title">
    <h2 id="rules-scrollbox-title" class="visually-hidden">Regeln und Warnungen</h2>

    <ol id="rules-list">
      <!-- dynamically filled using rule-item-template -->
    </ol>

  </section>

  <div id="rule-tables-container" class="sticky-bottom">
    <!-- ================= current rule preview ================= -->
    <div id="newRule" role="region" aria-labelledby="newRule-title">
      <h2 id="newRule-title" class="visually-hidden">Aktuelle Regel-Vorschau</h2>
      <span id="typing-text" aria-live="polite">&gt; Regel wird erstellt …</span>
      <span class="blinking-cursor noto cursor-stop" aria-hidden="true">▮</span>
    </div>
    <button id="test-rule" class="noto chevron" aria-label="Neue Regel analysieren" aria-expaended="false">📊</button>
    <div id="debug-output" class="hidden"></div>
    <h3 class="rule-new-warnings-list"> neue Regel => alle Warnungen:</h3>
    <ul id="rule-new-warnings-list" role="status" aria-live="polite">
      <!-- dynamically filled using warning-item-template -->
    </ul>
    <!-- #region Main Tables -->
    <div id="table-container">
      <!-- Main Table -->
      <div id="rule-diagram">
        <svg id="rule-lines">
          <path id="rule-line-base" />
          <path id="rule-line-flow" />
        </svg>

        <div id="rule-first-condition" class="left-table" data-scope="main">
          <table class="rule-table">
            <thead>
              <tr>
                <th id="rule-main-W-th" class="noto">
                  Wiederholungen:
                  <select id="rule-main-W-select" data-forbidden="true" class="noto">
                    <option value="W0">...</option>
                    <option value="W1">jeden</option>
                    <option value="W2">entweder</option>
                    <option value="W3">nur</option>
                    <option value="W4">x-mal</option>
                  </select>
                </th>
                <th id="rule-main-T-th" class="noto">
                  Zeitraum:
                  <select id="rule-main-T-select">
                    <option value="T0">Immer</option>
                    <option value="T1">Schicht</option>
                    <option value="T2">Tag</option>
                    <option value="T3">Woche</option>
                    <option value="T5">Abwesentheit</option>
                  </select>
                </th>
                <th id="rule-main-A-th" class="noto">
                  Anzahl
                  <select id="rule-main-A-select" class="noto">
                    <option value="A1">ungefär</option>
                    <option value="A3">zwischen</option>
                    <option value="A4">maximal</option>
                    <option value="A5">minimal</option>
                    <option value="A8">genau</option>
                  </select>
                </th>
                <th id="rule-main-G-th" class="noto">
                  Aufgaben:
                  <select id="rule-main-G-select">
                    <option value="G0">Aufgabe</option>
                    <option value="G1">Gruppe</option>
                    <option value="G2">Alternative</option>
                  </select>
                </th>
                <th id="rule-main-D-th" class="noto">
                  Abhängigkeiten:
                  <select id="rule-main-D-select" class="noto">
                    <option value="D0">anwesend</option>
                    <option value="D2">braucht</option>
                    <option value="D3">hilft</option>
                  </select>
                </th>
                <th id="rule-main-E-th" class="noto">
                  Ausnahmen:
                  <select id="rule-main-E-select">
                    <option value="E0">...</option>
                    <option value="E2">oder</option>
                    <option value="E3">aber</option>
                    <option value="E4">außer</option>
                    <option value="E5">aber nicht mehr als</option>
                    <option value="E6">aber nicht weniger als</option>
                  </select>
                </th>
              </tr>
            </thead>
            <tbody>
              <tr id="rule-main-row-0">
                <td id="rule-main-W-td"></td>
                <td id="rule-main-T-td"></td>
                <td id="rule-main-A-td"></td>
                <td id="rule-main-G-td"></td>
                <td id="rule-main-D-td"></td>
                <td id="rule-main-E-td"></td>
              </tr>
            </tbody>
          </table>
          <div class="tab-gab"></div>
          <div id="space-between-tables"></div>
          <!-- Second Table -->
          <div id="rule-second-condition" class="right-table" data-scope="ex">
            <table class="rule-table">
              <thead>
                <tr>
                  <th id="rule-ex-w-th" class="noto">
                    Wiederholungen:
                    <select id="rule-ex-w-select" class="noto">
                      <option value="w0">...</option>
                      <option value="w1">jeden</option>
                      <option value="w2">entweder</option>
                      <option value="w3">nur</option>
                      <option value="w4">x-mal</option>
                    </select>
                  </th>
                  <th id="rule-ex-t-th" class="noto">
                    Zeitraum:
                    <select id="rule-ex-t-select">
                      <option value="t0">...</option>
                      <option value="t1">Schicht</option>
                      <option value="t2">Tag</option>
                      <option value="t3">Woche</option>
                      <option value="t5">Abwesentheit</option>
                    </select>
                  </th>
                  <th id="rule-ex-a-th" class="noto">
                    Anzahl:
                    <select id="rule-ex-a-select" class="noto">
                      <option value="a1">ungefär</option>
                      <option value="a3">zwischen</option>
                      <option value="a4">maximal</option>
                      <option value="a5">minimal</option>
                      <option value="a8">genau</option>
                    </select>
                  </th>
                  <th id="rule-ex-g-th" class="noto">
                    Aufgaben:
                    <select id="rule-ex-g-select">
                      <option value="g">...</option>
                      <option value="g0">Aufgabe</option>
                      <option value="g1">Gruppe</option>
                      <option value="g2">Alternative</option>
                    </select>
                  </th>
                  <th id="rule-ex-d-th" class="noto">
                    Abhängigkeiten:
                    <select id="rule-ex-d-select" class="noto">
                      <option value="d">...</option>
                      <option value="d0">anwesend</option>
                      <option value="d2">braucht</option>
                      <option value="d3">hilft</option>
                    </select>
                  </th>
                </tr>
              </thead>
              <tbody>
                <tr id="rule-ex-row-0">
                  <td id="rule-ex-w-td"></td>
                  <td id="rule-ex-t-td"></td>
                  <td id="rule-ex-a-td"></td>
                  <td id="rule-ex-g-td"></td>
                  <td id="rule-ex-d-td"></td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
      <!-- #endregion -->
    </div>
  </div>
</div>

<template id="rule-category">
  <li class="rule-category flex-column">
    <div class="rule-category-header">
      <span class="rule-dot noto">⚪️</span>
      <button class="rule-chevron resize-button noto" aria-expanded="false"></button>
      <span class="warning-counter-category" active="false">⚠️ 0</span>
      <span class="rule-category-title"></span>
    </div>
    <ul class="rule-category-list"></ul>
  </li>
</template>

<template id="rule-item-template" class="rule-item-template">
  <li class="flex-column">
    <div class="flex-row  rule-container-row">
      <span class="rule-list-gab"></span>
      <span class="rule-role-marker flex-row">
        <span class="rule-dot noto rule-blue-dot">🔵</span>
        <span class="rule-dot noto rule-green-dot">🟢</span>
        <span class="rule-dot noto rule-red-dot">🔴</span>
        <span class="rule-dot noto rule-black-dot">⚫</span>
        <span class="rule-dot noto rule-yellow-dot">🟠</span>
      </span>
      <span class="rule-chevron resize-button noto" aria-expanded="false"></span>
      <span class="warning-counter-team" active="false">⚠️ 0</span>
      <span class="rule-text"></span>
      <span class="rule-ellipses" aria-label="Rule actions"></span>
    </div>
  </li>
</template>

<template id="warning-item-template">
  <li data-rule-id="">
    <span class="noto" aria-hidden="true">⚠️</span>
    <span class="warning-text"></span>
  </li>
</template>
