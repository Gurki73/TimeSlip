<!--
Story-Modus – Design & Aufgabe
Tutorial bleibt Tutorial: Die Bedienung und der Lernfortschritt haben immer Vorrang.
Story ist kein Selbstzweck: Jede Szene soll ein konkretes, schwer greifbares Konzept der App verständlicher oder erinnerbarer machen.
„Kaffeeküchen-Prinzip“: Abstrakte Regeln werden anhand konkreter, menschlicher Alltagssituationen erklärt.
Nicht die Hauptfunktionen erklären: Öffnungszeiten, Mitarbeiter anlegen usw. werden primär durch das eigentliche Tutorial erklärt.
Edge-Cases erzählen: Die Story konzentriert sich auf Situationen, bei denen einfache Regeln plötzlich kompliziert werden.
Ein Story-Moment → ein Konzept: Jede kleine Episode sollte idealerweise genau einen Aha-Moment erzeugen.
Menschen statt Datensätze: Der Demo-Cast besteht aus wiedererkennbaren Personen mit Persönlichkeit, Beziehungen und Eigenheiten.
Charaktere als Gedächtnisanker: Emoji, Namen, Running Gags und Popkultur-Referenzen helfen, Konzepte im Gedächtnis zu verankern.
Charaktere haben unterschiedliche Aufgaben: Manche erklären ein Konzept, andere sind Story-Anker, Mentoren, Konfliktfiguren oder einfach Teil der „Belegschaft“.
Tiana als Lernfigur: Sie ist selbst zunächst unerfahren und entdeckt die Konzepte gemeinsam mit dem Nutzer.
Weasel als Mentor: Er übersetzt komplizierte Sachverhalte in verständliche Alltagssituationen, statt technische Definitionen vorzutragen.
Bernd als Antagonist: Er verkörpert Excel, bestehende Gewohnheiten und Widerstand gegen Veränderungen – aber nicht als bloß dumme Karikatur.
Konflikte entstehen aus der Realität: Azubi-Regeln, Berufsschule, Schulferien, mehrere Rollen, Überschneidungen, Vertretungen, Toleranzen usw.
Humor als Lernhilfe: Dialoge und Running Gags dürfen lustig sein, sollten aber möglichst gleichzeitig ein Konzept transportieren.
Story und Technik ergänzen sich: Story = „Warum ist das kompliziert?“ / technische Hilfe = „Wie funktioniert es?“ / Tutorial = „Mach es jetzt.“
Kurze Episoden statt Roman: Die Story wird in kleine, optionale Szenen zerlegt und darf den Arbeitsfluss nicht ausbremsen.
Wiederkehrende Figuren statt Einmal-Beispiele: Ein Charakter kann über mehrere Kapitel hinweg unterschiedliche Konzepte illustrieren.
Setups & Payoffs: Früh eingeführte Eigenschaften können später unerwartet relevant werden.
Hero's Journey nur als Hintergrund: Tiana entwickelt sich von der unerfahrenen neuen Restaurantleiterin zur selbstständig planenden Verantwortlichen – ohne dass daraus ein Filmplot werden muss.
Erfolgskriterium: Der Nutzer soll am Ende nicht denken „Was für eine tolle Geschichte“, sondern „Ah, jetzt verstehe ich, warum die App das so macht.“
Oberstes Ziel: Das Tutorial soll sich weniger wie eine Bedienungsanleitung und mehr wie eine unterhaltsame Einführung in eine reale kleine Belegschaft anfühlen.
-->
