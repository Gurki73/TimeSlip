<!DOCTYPE html>
<!--
  Vacation Approval App – Prototype

  Description:
  A lightweight, offline-first web app for managing employee vacation requests
  in small businesses. Serves as a practical alternative to spreadsheets,
  with rule-based validation to ensure essential roles remain covered.

  Technical Details:
  - Built with plain HTML, CSS, and JavaScript for portability and simplicity.
  - Offline-first design; no login or backend required.
  - Optional external request used only for updating public holiday data.

  Target Environment:
  - Windows desktop devices with small screens
  - Offline usage supported

  Status:
  - Functional prototype
  - UI and accessibility features in progress

  License:
  MIT License – free for personal and commercial use.

  Created by Jörg Miethe to demonstrate practical development skills.
-->


<html lang="de">

<head>
  <meta charset="UTF-16" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Main Content Security Policy -->
  <meta http-equiv="Content-Security-Policy" content="
          default-src 'self';
          script-src 'self' 'nonce-PLACEHOLDER_NONCE';
          style-src 'self' 'nonce-PLACEHOLDER_NONCE';
          connect-src 'self' https://your-api.com;
          object-src 'none';
      " />

  <title>Mitarbeiter Kalender</title>

  <!-- Stylesheets -->
  <link rel="stylesheet" href="styles/global.css" />
  <link rel="stylesheet" href="assets/css/theme-dark.css" />
  <link rel="stylesheet" href="assets/css/theme-default.css" />
  <link rel="stylesheet" href="assets/css/theme-patel.css" />
  <link rel="stylesheet" href="assets/css/theme-greyscale.css" />
  <link rel="stylesheet" href="Components/legend/legend.css" />
  <link rel="stylesheet" href="Components/calendar/calendar.css" />
  <link rel="stylesheet" href="Components/emojiPicker/emojiPicker.css" />
  <link rel="stylesheet" href="Components/Slider/slider.css" />
  <link rel="stylesheet" href="assets/css/colors.css" />
  <link rel="stylesheet" href="assets/css/buttons.css" />
  <link rel="stylesheet" href="assets/css/icons.css" />
  <link rel="stylesheet" href="assets/css/emoji.css" />
  <link rel="stylesheet" href="Components/forms/role-form/role-form.css" />
  <link rel="stylesheet" href="Components/forms/rule-form/rule-form.css" />
  <link rel="stylesheet" href="Components/customDatePicker/customDatePicker.css" />
  <link rel="stylesheet" href="Components/forms/calendar-form/calendar-form.css" />
  <link rel="stylesheet" href="Components/forms/admin-form/admin-form.css" />
  <link rel="stylesheet" href="Components/forms/admin-form/tools/buyMeCoffee.css" />
  <link rel="stylesheet" href="Components/forms/request-form/request-form.css" />
  <link rel="stylesheet" href="Components/forms/employee-form/employee-form.css" />
  <link rel="stylesheet" href="Components/help/help.css" />
</head>

<body class="theme-dark mode-sample">
  <div id="main-container">
    <aside id="left-panel" class="split-panel left" tabindex="-1" aria-labelledby="sidebar-label">
      <h2 id="sidebar-label" class="visually-hidden">
        Seitenleiste Navigation
      </h2>

      <div id="legend" tabindex="-1" aria-label="Legende für Symbole und Farbcodes"></div>

      <div class="horizontal-divider-no-resize"></div>

      <nav id="sidebar" tabindex="-1">
        <button class="nav-button" data-form="request-form" title="Urlaubsantrag öffnen"
          aria-label="Urlaub – Urlaubsantrag öffnen">
          <img src="./assets/svg/file-document-svgrepo-com.svg" alt="Urlaub Icon" class="nav-icon" />
          <span><span class="underline">U</span>rlaub</span>
        </button>

        <button class="nav-button" data-form="employee-form" title="Mitarbeiterverwaltung öffnen"
          aria-label="Mitarbeiter – Mitarbeiterverwaltung öffnen">
          <img src="./assets/svg/person-team-svgrepo-com.svg" alt="Mitarbeiter Icon" class="nav-icon" />
          <span><span class="underline">M</span>itarbeiter</span>
        </button>

        <button class="nav-button" data-form="role-form" title="Aufgaben- und Rollenverwaltung öffnen"
          aria-label="Aufgaben – Rollenverwaltung öffnen">
          <img src="./assets/svg/puzzle-piece-svgrepo-com.svg" alt="Aufgaben Icon" class="nav-icon" />
          <span><span class="underline">A</span>ufgaben</span>
        </button>

        <button class="nav-button" data-form="rule-form" title="Regelwerk öffnen"
          aria-label="Regeln – Regelwerk öffnen">
          <img src="./assets/svg/knowledge-graph-svgrepo-com.svg" alt="Regeln Icon" class="nav-icon" />
          <span><span class="underline">R</span>egeln</span>
        </button>

        <button class="nav-button" data-form="calendar-form" title="Kalendereinstellungen öffnen"
          aria-label="Kalender – Kalendereinstellungen öffnen" id="nav-calendar-settings">
          <img src="./assets/svg/calendar-svgrepo-com.svg" alt="Kalender Icon" class="nav-icon" />
          <span><span class="underline">K</span>alender</span>
        </button>

        <button class="nav-button last-nav-button" data-form="admin-form" title="Adminwerkzeuge öffnen"
          aria-label="Werkzeuge – Adminwerkzeuge öffnen">
          <img src="./assets/svg/cog-wheel-settings-svgrepo-com.svg" alt="Werkzeuge Icon" class="nav-icon" />
          <span><span class="underline">W</span>erkzeuge</span>
        </button>
      </nav>
    </aside>

    <div id="vertical-divider">
      <button tabindex="0" id="resize-toggle" class="resize-button180" aria-controls="left-panel" aria-expanded="true"
        aria-label="Seitenleiste ein- oder ausblenden"></button>
    </div>

    <div id="right-panel" class="split-panel right">
      <!-- MAIN CALENDAR AREA -->
      <main id="calendar" class="top-row" tabindex="-1" aria-live="polite" aria-busy="true">
        <div class="layout-full-size">
          <div class="spinner" aria-hidden="true"></div>
          <span class="sr-only" id="loading-message">
            Kalender wird geladen…
          </span>
          <p>
            --- Drücke [F5], falls der Kalender nicht vollständig geladen
            wurde.
          </p>
        </div>
      </main>

      <!-- GREETING / HERO HEADER -->
      <div id="horizontal-divider"></div>
      <header id="horizontal-divider-box" class="bg-welcome" role="banner">
        <div id="divider-additional-buttons"></div>
        <div class="left-gap"></div>
        <h1 class="text-header-4" id="greetingID">
          Willkommen beim Mitarbeiter Kalender
        </h1>
        <div class="right-gap"></div>
      </header>

      <!-- MAIN CONTENT AREA -->
      <section class="bottom-row" aria-labelledby="greetingID">
        <div id="form-container"></div>
      </section>
    </div>
  </div>
  <footer id="feedback-console" role="status" aria-live="polite" tabindex="-1">
    Ready for action...
  </footer>
  <script type="module" src="./js/links.js"></script>
</body>

</html>

<dialog id="goodbyeDialog"></dialog>

<template id="tmp-welcome-page">
  <!-- MAIN CONTENT AREA -->
  <section class="bottom-row" aria-labelledby="greetingID">
    <section class="welcome-page text-arial" role="region" aria-label="Willkommensseite">
      <p class="text-header-4">
        Ihr Werkzeug zur einfachen Belegschaftsplanung. Rufe die Anleitung
        <span class="noto">❓</span> mit [F1] oder unter Menü
        <span class="noto">⇨ </span> Hilfe auf.
      </p>

      <!-- 
        Fn + F1 hint: shown only on small screens. 
        Reason: During testing with real clients, many users on laptops did not realize they needed to press Fn + F1 to access help. 
        On larger screens with full-size keyboards, dedicated F1 keys are available, so the hint is hidden.
      -->
      <div id="fn-key-hint" class="fn-hint visually-hidden" role="note" aria-label="Fn-Tastentipp">
        <img src="./assets/png/Fn-key.png" alt="Fn-Taste auf einer Laptop-Tastatur" class="fn-hint-img" />
        <p>
          <span class="noto">💡</span> Tipp: Auf vielen Laptops müssen Sie <kbd>Fn</kbd> +
          <kbd>F1</kbd> oder <kbd>F12</kbd> drücken, um
          Tastenkombinationen zu nutzen.
        </p>
        <button id="fn-hint-close" class="noto" aria-label="Hinweis schließen">❌</button>
      </div>

      <div class="layout-full-size flex-row">
        <div class="cards-container">
          <article class="layout-card layout-card.request" aria-labelledby="heading-request">
            <h4 class="card-title text-request" id="heading-request">
              <img src="./assets/svg/file-document-svgrepo-com.svg" alt="" class="nav-icon" aria-hidden="true" />
              <span class="card-title-text">Urlaubsanträge</span>
              <img src="./assets/svg/file-document-svgrepo-com.svg" alt="" class="nav-icon" aria-hidden="true" />
            </h4>
            <p class="text-header-5">
              <strong>Wieso</strong> ist jemand nicht da?
            </p>
            <p class="text-small">
              Urlaube, Abwesenheiten und deren Status übersichtlich verwalten.
            </p>
          </article>

          <article class="layout-card layout-card.employee" aria-labelledby="heading-employee">
            <h4 class="card-title text-employee" id="heading-employee">
              <img src="./assets/svg/person-team-svgrepo-com.svg" alt="" class="nav-icon" aria-hidden="true" />
              <span class="card-title-text">Mitarbeiter</span>
              <img src="./assets/svg/person-team-svgrepo-com.svg" alt="" class="nav-icon" aria-hidden="true" />
            </h4>
            <p class="text-header-5">
              <strong>Wer</strong> kann <strong>was</strong> – und <strong>wann</strong>?
            </p>
            <p class="text-small">
              Mitarbeiter definieren und Aufgaben und individuelle Arbeitszeiten zuweisen.
            </p>
          </article>

          <article class="layout-card layout-card.tasks" aria-labelledby="heading-tasks">
            <h4 class="card-title text-tasks" id="heading-tasks">
              <img src="./assets/svg/puzzle-piece-svgrepo-com.svg" alt="" class="nav-icon" aria-hidden="true" />
              <span class="card-title-text">Aufgaben</span>
              <img src="./assets/svg/puzzle-piece-svgrepo-com.svg" alt="" class="nav-icon" aria-hidden="true" />
            </h4>
            <p class="text-header-5">
              <strong>Was</strong> wird überhaupt gemacht?
            </p>
            <p class="text-small">
              Aufgaben anlegen, benennen und visuell gruppieren.
            </p>
          </article>

          <article class="layout-card layout-card.rules" aria-labelledby="heading-rules">
            <h4 class="card-title text-rules" id="heading-rules">
              <img src="./assets/svg/knowledge-graph-svgrepo-com.svg" alt="" class="nav-icon" aria-hidden="true" />
              <span class="card-title-text">Regeln</span>
              <img src="./assets/svg/knowledge-graph-svgrepo-com.svg" alt="" class="nav-icon" aria-hidden="true" />
            </h4>
            <p class="text-header-5">
              <strong>Wie</strong> sieht ein ideales Team aus?
            </p>
            <p class="text-small">
              Regeln festlegen, die eib optimales Zusamenspiel vorgibt.
            </p>
          </article>

          <article class="layout-card layout-card.calendar" aria-labelledby="heading-calendar">
            <h4 class="card-title text-calendar" id="heading-calendar">
              <img src="./assets/svg/calendar-svgrepo-com.svg" alt="" class="nav-icon" aria-hidden="true" />
              <span class="card-title-text">Kalender</span>
              <img src="./assets/svg/calendar-svgrepo-com.svg" alt="" class="nav-icon" aria-hidden="true" />
            </h4>
            <p class="text-header-5">
              <strong>Wann</strong> wird gearbeitet?
            </p>
            <p class="text-small">
              Öffnungszeiten, Feiertage, Zeitfenster und besondere Tage festlegen.
            </p>
          </article>
        </div>
      </div>
    </section>
  </section>
</template>
